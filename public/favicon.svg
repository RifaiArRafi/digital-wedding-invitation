<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c9a5" />
      <stop offset="50%" stop-color="#c4a47c" />
      <stop offset="100%" stop-color="#9a7b53" />
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" rx="128" fill="#141414" />
  
  <!-- Subtle Outer Border -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />

  <!-- Monogram S & E -->
  <g fill="url(#goldGrad)" text-anchor="middle" dominant-baseline="central">
    <!-- Letter S -->
    <text 
      x="170" 
      y="262" 
      font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" 
      font-size="200" 
      font-weight="500"
      letter-spacing="0"
    >S</text>

    <!-- Ampersand & -->
    <text 
      x="256" 
      y="260" 
      font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" 
      font-size="110" 
      font-style="italic"
      font-weight="300"
      opacity="0.85"
    >&amp;</text>

    <!-- Letter E -->
    <text 
      x="342" 
      y="262" 
      font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" 
      font-size="200" 
      font-weight="500"
      letter-spacing="0"
    >E</text>
  </g>
</svg>
